name: Label new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add project:nio label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api --method POST "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/labels" -f 'labels[]=project:nio'
